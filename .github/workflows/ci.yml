name: BioGuard-X CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ui/professional-refresh"]

permissions:
  contents: read

concurrency:
  group: bioguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Install only the packages needed by the current automated test suite.
      # The full biometric runtime stack (PyTorch, InsightFace, AFIS) is not
      # required by the tests, which use deterministic fake biometric engines.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy<2" \
            "scipy>=1.11" \
            "scikit-learn>=1.4,<2" \
            "scikit-image>=0.22" \
            "opencv-python-headless>=4.10,<5" \
            "joblib>=1.3" \
            "librosa>=0.10,<0.12" \
            "soundfile>=0.12" \
            "pytest>=8"

      - name: Compile application and source
        run: python -m compileall -q app src

      - name: Run automated tests
        run: python -m pytest -q
